<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Complex Website</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#gallery">Gallery</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Home Section with a Hero Image -->
    <section id="home" class="hero">
        <img src="your-hero-image.jpg" alt="Hero Image" class="hero-image">
        <h1>Welcome to My Website!</h1>
        <p>Discover more about what we do.</p>
        <button onclick="changeMessage()">Learn More</button>
        <p id="message"></p>
    </section>

    <!-- About Section -->
    <section id="about">
        <h2>About Us</h2>
        <p>We are a creative team with a passion for technology and design.</p>
    </section>

    <!-- Gallery Section -->
    <section id="gallery">
        <h2>Gallery</h2>
        <div class="gallery-grid">
            <img src="your-image1.jpg" alt="Image 1">
            <img src="your-image2.jpg" alt="Image 2">
            <img src="your-image3.jpg" alt="Image 3">
            <!-- Add more images as needed -->
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact">
        <h2>Contact Us</h2>
        <p>Feel free to reach out to us!</p>
        <form action="#">
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 My Complex Website</p>
        <p>Contact: email@example.com</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
